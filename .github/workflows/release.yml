name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libglib2.0-dev \
            libgdk-pixbuf-2.0-dev libcairo2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          cp target/release/clipd "clipd-${{ matrix.arch }}"
          strip "clipd-${{ matrix.arch }}"
          sha256sum "clipd-${{ matrix.arch }}" > "clipd-${{ matrix.arch }}.sha256"
          # The un-suffixed asset is the x86_64 build (backwards compatibility).
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp "clipd-${{ matrix.arch }}" clipd
            cp "clipd-${{ matrix.arch }}.sha256" clipd.sha256
          fi
          cat clipd-*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: clipd-${{ matrix.arch }}
          path: |
            clipd-${{ matrix.arch }}
            clipd-${{ matrix.arch }}.sha256
            clipd
            clipd.sha256
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
