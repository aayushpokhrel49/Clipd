name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libglib2.0-dev libgdk-pixbuf-2.0-dev libcairo2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          cp target/release/clipd clipd
          strip clipd
          sha256sum clipd > clipd.sha256
          cat clipd.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clipd
            clipd.sha256
          generate_release_notes: true