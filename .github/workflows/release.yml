name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native x86_64.
          - runner: ubuntu-22.04
            arch: x86_64
            nfpm_arch: amd64
            nfpm_asset: x86_64
          # Native arm64 (public GitHub-hosted ARM runner).
          - runner: ubuntu-24.04-arm
            arch: aarch64
            nfpm_arch: arm64
            nfpm_asset: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libglib2.0-dev \
            libgdk-pixbuf-2.0-dev libcairo2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Stage binary and checksums
        run: |
          mkdir -p dist
          cp target/release/clipd dist/clipd
          strip dist/clipd
          # Self-updater assets (see src/update.rs::select_assets).
          cp dist/clipd "clipd-${{ matrix.arch }}"
          sha256sum "clipd-${{ matrix.arch }}" > "clipd-${{ matrix.arch }}.sha256"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp "clipd-${{ matrix.arch }}" clipd
            cp "clipd-${{ matrix.arch }}.sha256" clipd.sha256
          fi

      - name: Install nfpm
        run: |
          curl -sSL -o nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_${{ matrix.nfpm_asset }}.tar.gz"
          tar -xzf nfpm.tgz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Build .deb / .rpm / Arch / Alpine packages
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.nfpm_arch }}
        run: |
          set -eux
          ver="${VERSION#v}"
          for fmt in deb rpm archlinux apk; do
            VERSION="$ver" ARCH="$ARCH" nfpm package \
              -f packaging/nfpm.yaml -p "$fmt" -t dist/
          done
          # Checksums for the packages too.
          (cd dist && sha256sum *.deb *.rpm *.pkg.tar.zst *.apk > packages.sha256 && cat packages.sha256)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: clipd-${{ matrix.arch }}
          path: |
            clipd-${{ matrix.arch }}
            clipd-${{ matrix.arch }}.sha256
            clipd
            clipd.sha256
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.apk
            dist/packages.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
